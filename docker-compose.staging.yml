# Staging override — usage: docker compose -f docker-compose.yml -f docker-compose.staging.yml up
version: '3.8'
services:
  server:
    environment:
      NODE_ENV: staging
      LOG_LEVEL: info
    restart: always
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1'
          memory: 1G

  chat-service:
    restart: always
    deploy:
      replicas: 2

  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?must be set in staging}
    restart: always
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data

  redis:
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?must be set}
    volumes:
      - redis_staging_data:/data

volumes:
  postgres_staging_data:
  redis_staging_data:
