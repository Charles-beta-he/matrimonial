version: '3.8'
services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: matrimonial
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: matrimonial_dev
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  meilisearch:
    image: getmeili/meilisearch:v1.11
    ports:
      - '7700:7700'
    environment:
      MEILI_ENV: development
    volumes:
      - meilidata:/meili_data

  livekit:
    image: livekit/livekit-server:latest
    ports:
      - '7880:7880'
      - '7881:7881'
    environment:
      LIVEKIT_KEYS: "devkey: secret"

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - '3000:3000'
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql://matrimonial:dev_password@postgres:5432/matrimonial_dev
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      RECOMMEND_SERVICE_URL: http://recommend-service:8000
      CHAT_SERVICE_URL: http://chat-service:3002
      LIVEKIT_WS_URL: ws://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      # Third-party keys passed through from host env
      ALIYUN_SMS_ACCESS_KEY_ID: ${ALIYUN_SMS_ACCESS_KEY_ID:-}
      ALIYUN_SMS_ACCESS_KEY_SECRET: ${ALIYUN_SMS_ACCESS_KEY_SECRET:-}
      ALIYUN_SMS_SIGN_NAME: ${ALIYUN_SMS_SIGN_NAME:-}
      ALIYUN_SMS_TEMPLATE_CODE: ${ALIYUN_SMS_TEMPLATE_CODE:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_BUCKET: ${OSS_BUCKET:-matrimonial-dev}
      OSS_REGION: ${OSS_REGION:-oss-cn-hangzhou}
      ALIYUN_VERIFY_APP_CODE: ${ALIYUN_VERIFY_APP_CODE:-}
      ALIYUN_GREEN_ACCESS_KEY_ID: ${ALIYUN_GREEN_ACCESS_KEY_ID:-}
      ALIYUN_GREEN_ACCESS_KEY_SECRET: ${ALIYUN_GREEN_ACCESS_KEY_SECRET:-}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_MCH_ID: ${WECHAT_MCH_ID:-}
      WECHAT_API_V3_KEY: ${WECHAT_API_V3_KEY:-}
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY:-}
      ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      JPUSH_APP_KEY: ${JPUSH_APP_KEY:-}
      JPUSH_MASTER_SECRET: ${JPUSH_MASTER_SECRET:-}

  chat-service:
    build: services/chat-service
    ports:
      - '3002:3002'
    depends_on:
      - redis

  media-service:
    build: services/media-service
    ports:
      - '3003:3003'

  recommend-service:
    build: services/recommend-service
    ports:
      - '8000:8000'
    depends_on:
      - redis

  audit-service:
    build: services/audit-service
    ports:
      - '8001:8001'

volumes:
  pgdata:
  meilidata:
